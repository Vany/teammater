<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <title>Teammater</title>
        <link rel="stylesheet" href="index.css" />
        <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" crossorigin="anonymous"></script>
    </head>
    <body>
        <div class="main-content">
            <h1>Twitch Chat</h1>
            <div id="output"></div>
        </div>

        <div class="control-panel">
            <audio id="myAudio" src="mp3/boo.mp3" preload="auto"></audio>

            <!-- Module Container (new modular system) -->
            <div id="modules-container" class="modules-container"></div>

            <!-- Mobile remote QR code -->
            <div id="mobile-panel" style="padding:8px 4px;border-top:1px solid #333;margin-bottom:6px;">
                <a id="mobile-qr-link" href="#" target="_blank" style="display:inline-block;">
                    <div id="mobile-qr"></div>
                </a>
            </div>

            <a href="/neco.html?t=100" target="_blank">1M</a>
            <a href="/neco.html?t=300" target="_blank">5M</a>
            <a href="/neco.html?t=600" target="_blank">10M</a>
            <a href="/obs.html" target="_blank" align="right">OBS</a>
            <hr />
            <button
                class="test-button"
                onclick="voice()({}, 'testuser', 'Test passed')"
            >
                TEST
            </button>
            <a href="https://www.twitch.tv/vanyserezhkin" target="_blank"
                >https://www.twitch.tv/vanyserezhkin</a
            >
            <input
                type="text"
                id="announce-input"
                stored_as="announce"
                style="width: 90%"
            />

            <div class="control-section">
                <label class="checkbox-label">
                    <input
                        type="checkbox"
                        stored_as="loud"
                        stored_default="true"
                        id="loudCheckbox"
                    />
                    🌸 loud
                </label>
            </div>
        </div>

        <script>
            (() => {
                const HISTORY_KEY = "announce_history";
                const MAX_HISTORY = 200;
                let historyIndex = null; // null = not browsing
                let draft = "";

                function getHistory() {
                    try {
                        return (
                            JSON.parse(localStorage.getItem(HISTORY_KEY)) || []
                        );
                    } catch {
                        return [];
                    }
                }
                function saveHistory(h) {
                    localStorage.setItem(HISTORY_KEY, JSON.stringify(h));
                }
                function pushHistory(value) {
                    const h = getHistory();
                    if (value && h[h.length - 1] !== value) {
                        h.push(value);
                        if (h.length > MAX_HISTORY)
                            h.splice(0, h.length - MAX_HISTORY);
                        saveHistory(h);
                    }
                }

                // ── Announce timer ────────────────────────────────────────
                // Started on stream:online. Cancelled by sending announce.
                // On expire: play startup.mp3 + red border.
                const ANNOUNCE_TIMER_MS = 10 * 60 * 1000;
                let announceTimer = null;
                const startupAudio = new Audio("mp3/startup.mp3");

                function clearAnnounceTimer(input) {
                    if (!announceTimer) return;
                    clearTimeout(announceTimer);
                    announceTimer = null;
                    input.style.borderColor = "";
                    console.log("[announce-timer] cancelled");
                }

                function startAnnounceTimer(input) {
                    clearAnnounceTimer(input);
                    console.log("[announce-timer] started (10 min)");
                    announceTimer = setTimeout(() => {
                        announceTimer = null;
                        input.style.borderColor = "red";
                        startupAudio.currentTime = 0;
                        startupAudio.play().catch(() => {});
                        console.log("[announce-timer] expired — border red, playing startup.mp3");
                    }, ANNOUNCE_TIMER_MS);
                }

                document.addEventListener("stream:online", () => {
                    const input = document.getElementById("announce-input");
                    if (input) startAnnounceTimer(input);
                });
                // ─────────────────────────────────────────────────────────

                document.addEventListener("DOMContentLoaded", () => {
                    const input = document.getElementById("announce-input");
                    if (!input) return;

                    input.addEventListener("keydown", async (e) => {
                        const h = getHistory();

                        if (e.key === "ArrowUp") {
                            e.preventDefault();
                            if (h.length === 0) return;
                            if (historyIndex === null) {
                                draft = input.value;
                                historyIndex = h.length - 1;
                            } else if (historyIndex > 0) {
                                historyIndex--;
                            }
                            input.value = h[historyIndex];
                        } else if (e.key === "ArrowDown") {
                            e.preventDefault();
                            if (historyIndex === null) return;
                            if (historyIndex < h.length - 1) {
                                historyIndex++;
                                input.value = h[historyIndex];
                            } else {
                                historyIndex = null;
                                input.value = draft;
                            }
                        } else if (e.key === "Enter") {
                            const value = input.value.trim();
                            if (!value) return;
                            pushHistory(value);
                            historyIndex = null;
                            draft = "";

                            // ANNOUNCE is a hook YOU define, not code in this repo:
                            // put `async function ANNOUNCE(text) { ... }` (posts to
                            // Telegram/Discord/wherever) in localStorage under the
                            // key "ANNOUNCE". Direct eval() is deliberate — that is
                            // what lets a bare `function ANNOUNCE...` declaration
                            // bind into this handler's scope for the call below;
                            // switching to indirect eval or new Function() would
                            // run it in global scope instead and break that.
                            //
                            // The real bug here used to be ORDER: the timer was
                            // cleared BEFORE this ran, so a ReferenceError (no
                            // ANNOUNCE configured yet) surfaced only as an
                            // unhandled rejection and silently cancelled the
                            // 10-minute reminder along with losing the
                            // announcement. Clear only on success now, and fail
                            // loud instead of an invisible unhandled rejection.
                            const announceSrc = localStorage.getItem("ANNOUNCE");
                            if (!announceSrc) {
                                console.error(
                                    "[announce] No ANNOUNCE hook configured — " +
                                    "set localStorage['ANNOUNCE'] to an " +
                                    "`async function ANNOUNCE(text) {...}` that " +
                                    "posts to Telegram/Discord.",
                                );
                                input.style.borderColor = "red";
                                return;
                            }
                            try {
                                eval(announceSrc);
                                const result = await ANNOUNCE(value);
                                console.log("[announce] sent:", value, result);
                                clearAnnounceTimer(input);
                            } catch (err) {
                                console.error("[announce] ANNOUNCE failed:", err);
                                input.style.borderColor = "red";
                            }
                        } else {
                            // Any other key resets history browsing
                            historyIndex = null;
                        }
                    });
                });
            })();
        </script>
        <script>
            // Populate mobile QR code after page loads
            fetch('/api/info')
                .then(r => r.json())
                .then(({ lan_ip, port, bus_token }) => {
                    if (!lan_ip) return;
                    // Token in the FRAGMENT, not the query: fragments are never
                    // sent to the server, so it stays out of access logs and
                    // Referer headers. The /obs bus rejects clients without it,
                    // so the phone must carry it or the remote is dead.
                    const url = `https://${lan_ip}:${port}/mobile`
                        + (bus_token ? `#token=${encodeURIComponent(bus_token)}` : '');
                    document.getElementById('mobile-qr-link').href = url;
                    if (typeof QRCode !== 'undefined') {
                        new QRCode(document.getElementById('mobile-qr'), {
                            text: url,
                            width: 80,
                            height: 80,
                            colorDark: '#ffffff',
                            colorLight: '#1a1a1a',
                        });
                    }
                })
                .catch(() => {});
        </script>
        <script type="module" src="index.js"></script>
    </body>
</html>

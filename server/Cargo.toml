[package]
name = "teammater-server"
version = "0.1.0"
edition = "2021"

[dependencies]
# Path guard must compare the DECODED path — ServeDir decodes before it
# touches the filesystem. See deny_sensitive_paths in main.rs.
percent-encoding = "2"
# str::to_lowercase() is Unicode LOWERCASE MAPPING (for display), not CASE
# FOLDING (for caseless comparison) — they differ for characters like U+017F
# LATIN SMALL LETTER LONG S, which lowercase-maps to itself but case-FOLDS to
# 's'. macOS APFS's case-insensitive comparison is Unicode case folding, so
# to_lowercase() alone missed this. Same crate Servo uses for this purpose.
caseless = "0.2"
tokio = { version = "1.42", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
rcgen = "0.13"
rustls = "0.23"
rustls-pemfile = "2.2"
tokio-rustls = "0.26"
anyhow = "1.0"
mdns-sd = "0.10"
btleplug = "0.11"
uuid = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
if-addrs = "0"
sysinfo = "0.31"
rand = "0.8"

<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Teammater</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body {
      background: #0d0d0d;
      color: #eee;
      font-family: system-ui, -apple-system, sans-serif;
      height: 100%;
      overflow: hidden;
      user-select: none;
    }

    #conn-dot {
      position: fixed;
      top: 8px; right: 8px;
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #555;
      z-index: 200;
      transition: background 0.3s;
    }

    /* Live screen-wake-lock state — glance for colour, tap for the exact error */
    #wake-dot {
      position: fixed;
      top: 5px; right: 24px;
      font: 700 11px/1.3 system-ui, sans-serif;
      padding: 1px 5px;
      border-radius: 8px;
      background: #555;
      color: #fff;
      z-index: 200;
      transition: background 0.3s;
    }

    #layout {
      display: flex;
      height: 100vh;
    }

    /* ── Log panel ── */
    #log-panel {
      width: 35%;
      background: #111;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #222;
    }
    #log-header {
      padding: 6px 8px;
      font-size: 10px;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 1px solid #1e1e1e;
      flex-shrink: 0;
    }
    #log-output {
      flex: 1;
      overflow-y: auto;
      padding: 4px 6px;
      font-family: monospace;
      font-size: 10px;
      color: #888;
    }
    .log-line { padding: 1px 0; word-break: break-all; line-height: 1.4; }
    .log-chat {
      padding: 3px 0;
      word-break: break-word;
      line-height: 1.3;
      font-size: 20px;
      color: #eee;
    }
    .log-chat .chat-user { color: #88bbff; font-weight: 600; }

    /* ── Controls panel ── */
    #controls-panel {
      flex: 1;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
    }

    .section-label {
      font-size: 10px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 5px;
    }

    /* ── Scene section ── */
    #scene-section {
      background: #1a2030;
      border: 1px solid #2a3550;
      border-radius: 8px;
      padding: 10px 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 50px;
      flex-shrink: 0;
    }
    #scene-section:active { background: #222a3a; }
    #scene-name {
      font-size: 17px;
      font-weight: 600;
      color: #cce;
    }
    #scene-arrow { color: #557; font-size: 18px; }

    /* ── Streaming section ── */
    #streaming-section {
      background: #0a1a0f;
      border: 1px solid #1a3020;
      border-radius: 8px;
      padding: 10px 14px;
      flex-shrink: 0;
    }
    #stream-live-row {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 4px;
    }
    #stream-live-badge {
      background: #cc2222;
      color: white;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 3px;
      letter-spacing: 1px;
    }
    #stream-time {
      font-size: 24px;
      font-weight: 700;
      color: #44dd88;
      font-variant-numeric: tabular-nums;
    }
    #viewer-count {
      margin-left: auto;
      font-size: 18px;
      font-weight: 700;
      color: #aaeebb;
      font-variant-numeric: tabular-nums;
    }
    #viewer-count::after { content: ' 👁'; font-size: 14px; }
    #stream-quality { font-size: 12px; margin-top: 3px; color: #aaa; }

    /* ── Heart rate + Song row ── */
    #meta-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    #heartrate-section {
      background: #0d1520;
      border: 1px solid #1a2840;
      border-radius: 8px;
      padding: 7px 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    #heart-icon {
      font-size: 18px;
      display: inline-block;
    }
    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      40%       { transform: scale(1.3); }
    }
    #heart-icon.beating {
      animation: heartbeat var(--hb-dur, 0.8s) ease-in-out infinite;
    }
    #heart-bpm {
      font-size: 20px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      min-width: 36px;
    }
    #song-section {
      flex: 1;
      background: #0d150d;
      border: 1px solid #1a2a1a;
      border-radius: 8px;
      padding: 5px 8px 5px 10px;
      overflow: hidden;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 8px;
    }
    #song-text {
      flex: 1;
      overflow: hidden;
      min-width: 0;
    }
    #song-title {
      font-size: 13px;
      font-weight: 600;
      color: #aaeebb;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #song-artist {
      font-size: 11px;
      color: #668866;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #music-controls {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }
    #music-controls button {
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      background: #162416;
      color: #adc;
      transition: opacity 0.15s;
    }
    #music-controls button:active { opacity: 0.7; }
    #btn-music-playpause { width: 42px; font-size: 18px; }
    #song-cover {
      width: 42px; height: 42px;
      border-radius: 5px;
      object-fit: cover;
      flex-shrink: 0;
      display: none;
    }
    #song-cover.visible { display: block; }

    /* ── Sysinfo section (in meta-row) ── */
    #sysinfo-section {
      background: #0d1520;
      border: 1px solid #1a2840;
      border-radius: 8px;
      padding: 7px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .sys-m-item {
      display: flex;
      align-items: center;
      gap: 3px;
    }
    .sys-m-icon { font-size: 13px; }
    .sys-m-val {
      font-size: 16px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      min-width: 28px;
      color: #44dd88;
    }
    .sys-m-sep { color: #333; font-size: 14px; }

    /* ── Friends watching section ── */
    #friends-section {
      background: #0e0816;
      border: 1px solid #3a1560;
      border-radius: 8px;
      padding: 8px 12px;
      flex-shrink: 0;
    }
    #friends-label {
      font-size: 10px;
      color: #7a4a9a;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 5px;
    }
    #friends-list {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 10px;
    }
    .friend-item {
      font-size: 14px;
      font-weight: 500;
      color: #9966bb;
      border-radius: 4px;
      padding: 1px 4px;
    }
    .friend-item.watching {
      font-weight: 700;
      color: #cc88ff;
    }
    @keyframes friendFlash {
      0%   { color: #ffffff; text-shadow: 0 0 8px #ff88ff, 0 0 24px #cc33ff; background: rgba(200, 50, 255, 0.3); }
      40%  { color: #f0c0ff; text-shadow: 0 0 4px #cc44ff; background: rgba(150, 30, 200, 0.12); }
      100% { background: transparent; }
    }
    .friend-item.new {
      animation: friendFlash 10s ease-out forwards;
    }

    /* ── Recording section ── */
    #recording-section {
      background: #130a0a;
      border: 1px solid #2a1515;
      border-radius: 8px;
      padding: 8px 10px;
      flex-shrink: 0;
    }
    /* Single row: [●REC/■STOP] [timer] [⏸PAUSE/▶RESUME] */
    #rec-row {
      display: flex;
      align-items: stretch;
      gap: 8px;
      min-height: 68px;
    }
    #btn-rec-toggle {
      flex: 0 0 72px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    #btn-rec-toggle:active { opacity: 0.8; }
    #btn-rec-toggle.state-idle { background: #aa1111; color: white; }
    #btn-rec-toggle.state-active { background: #333; color: #ccc; }
    #rec-time {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: #dd4444;
    }
    #btn-pause-rec {
      flex: 0 0 110px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    #btn-pause-rec:active { opacity: 0.8; }
    #btn-pause-rec:disabled { opacity: 0.25; cursor: default; }
    #btn-pause-rec.state-pause  { background: #cc7700; color: white; }
    #btn-pause-rec.state-resume { background: #1a8833; color: white; }
    #btn-pause-rec.state-off    { background: #222; color: #555; }

    /* ── Scene picker modal ── */
    #scene-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    #scene-modal.open { display: flex; }
    #scene-list-wrap {
      width: min(380px, 88vw);
      max-height: 80vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 7px;
      padding: 16px;
      background: #141414;
      border-radius: 12px;
      border: 1px solid #2a2a2a;
    }
    #scene-modal-title {
      font-size: 12px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
      padding-bottom: 8px;
      border-bottom: 1px solid #222;
    }
    .scene-btn {
      width: 100%;
      min-height: 52px;
      background: #1c1c2a;
      border: 1px solid #2a2a3a;
      border-radius: 8px;
      color: #dde;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      padding: 0 14px;
      display: flex;
      align-items: center;
    }
    .scene-btn:active { background: #252540; }
    .scene-btn.current {
      border-color: #4466cc;
      background: #151525;
      color: #88aaff;
    }
    #scene-dismiss {
      width: 100%;
      padding: 10px;
      background: transparent;
      border: 1px solid #333;
      border-radius: 8px;
      color: #666;
      font-size: 13px;
      cursor: pointer;
      margin-top: 4px;
    }

    /* ── User action menu ── */
    #user-menu {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 2000;
      touch-action: none;
    }
    #user-menu.open { display: flex; }
    #user-menu-sheet {
      width: 100%;
      background: #1a1a1a;
      border-radius: 18px 18px 0 0;
      padding: 20px 16px 44px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    #user-menu-name {
      font-size: 15px;
      color: #88bbff;
      font-weight: 700;
      text-align: center;
      margin-bottom: 10px;
      padding-bottom: 12px;
      border-bottom: 1px solid #2a2a2a;
    }
    .user-menu-btn {
      width: 100%;
      padding: 20px 16px;
      border: none;
      border-radius: 12px;
      font-size: 19px;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      transition: opacity 0.15s;
    }
    .user-menu-btn:active { opacity: 0.7; }
    #btn-shoutout { background: #1a3050; color: #88ccff; }
    #btn-mute     { background: #3a1515; color: #ff8888; }
  </style>
</head>
<body>

<div id="wake-dot" title="Wake lock">🌙</div>
<div id="conn-dot" title="Disconnected"></div>

<div id="layout">

  <!-- Left: log feed -->
  <div id="log-panel">
    <div id="log-header">Log</div>
    <div id="log-output"></div>
  </div>

  <!-- Right: OBS controls -->
  <div id="controls-panel">

    <!-- Scene -->
    <div id="scene-section" onclick="openScenePicker()">
      <span id="scene-name">—</span>
      <span id="scene-arrow">▾</span>
    </div>

    <!-- Streaming (hidden when not live) -->
    <div id="streaming-section" style="display:none">
      <div class="section-label">Streaming</div>
      <div id="stream-live-row">
        <span id="stream-live-badge">LIVE</span>
        <span id="stream-time">0:00:00</span>
        <span id="viewer-count"></span>
      </div>
      <div id="stream-quality"></div>
    </div>

    <!-- Heart rate + Song name -->
    <div id="meta-row">
      <div id="heartrate-section" style="display:none">
        <span id="heart-icon">🩵</span>
        <span id="heart-bpm">--</span>
      </div>
      <div id="sysinfo-section" style="display:none">
        <div class="sys-m-item">
          <span class="sys-m-icon">🌡</span>
          <span id="sys-temp-mobile" class="sys-m-val">--°</span>
        </div>
        <span class="sys-m-sep">·</span>
        <div class="sys-m-item">
          <span class="sys-m-icon">🦠</span>
          <span id="sys-cpu-mobile" class="sys-m-val">--%</span>
        </div>
      </div>
      <div id="song-section" style="display:none">
        <img id="song-cover" alt="" />
        <div id="song-text">
          <div id="song-title">—</div>
          <div id="song-artist"></div>
        </div>
        <div id="music-controls">
          <button onclick="sendCmd('music_prev')" title="Previous">⏮</button>
          <button id="btn-music-playpause" onclick="toggleMusicPause()" title="Play / Pause">▶</button>
          <button onclick="sendCmd('music_skip')" title="Skip">⏭</button>
        </div>
      </div>
    </div>

    <!-- Friends watching (hidden when none) -->
    <div id="friends-section" style="display:none">
      <div id="friends-label">👥 Friends watching</div>
      <div id="friends-list"></div>
    </div>

    <!-- Recording (always shown) -->
    <div id="recording-section">
      <div id="rec-row">
        <button id="btn-rec-toggle" class="state-idle" onclick="toggleRec()">● REC</button>
        <span id="rec-time">0:00:00</span>
        <button id="btn-pause-rec" class="state-off" disabled onclick="togglePause()">⏸ PAUSE</button>
      </div>
    </div>

  </div>
</div>

<!-- User action menu -->
<div id="user-menu" onclick="onUserMenuBackdrop(event)">
  <div id="user-menu-sheet">
    <div id="user-menu-name"></div>
    <button class="user-menu-btn" id="btn-shoutout" onclick="doShoutout()">📣 &nbsp;Shout out</button>
    <button class="user-menu-btn" id="btn-mute"     onclick="doMute()">🔇 &nbsp;Mute 10 minutes</button>
  </div>
</div>

<!-- Scene picker modal -->
<div id="scene-modal" onclick="onModalBackdrop(event)">
  <div id="scene-list-wrap">
    <div id="scene-modal-title">Select Scene</div>
    <div id="scene-list"></div>
    <button id="scene-dismiss" onclick="closeScenePicker()">Cancel</button>
  </div>
</div>

<script>
// ─── State ───────────────────────────────────────────────────────────────────
let ws = null;
let obsState = { connected: false, scene: '', scenes: [], streaming: null, recording: null };
let viewerCount = null;
let musicPaused = false;
let streamBaseMs = 0, streamBaseTime = 0;
let recBaseMs = 0, recBaseTime = 0;
let reconnectTimer = null;
// user → { isNew: bool, timer: timeoutId | null }
let watchingFriends = {};

// ─── WebSocket ────────────────────────────────────────────────────────────────
// The /obs bus requires a token. A phone is not loopback, so it cannot ask
// /api/info for it — the token rides in the QR URL fragment as #token=… and is
// kept here. A fragment, not a query: it never reaches the server or its logs.
const BUS_TOKEN_KEY = 'obs_bus_token';
(function captureTokenFromHash() {
  const fromHash = new URLSearchParams(location.hash.slice(1)).get('token');
  if (fromHash) {
    localStorage.setItem(BUS_TOKEN_KEY, fromHash);
    history.replaceState(null, '', location.pathname + location.search);
  }
})();

function connect() {
  clearTimeout(reconnectTimer);
  const token = localStorage.getItem(BUS_TOKEN_KEY);
  if (!token) {
    setDot(false);
    appendLog('❌ No bus token — rescan the QR code on the main page');
    reconnectTimer = setTimeout(connect, 5000);
    return;
  }
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/obs?token=${encodeURIComponent(token)}`);

  ws.onopen = () => {
    setDot(true);
    ws.send(JSON.stringify({ request: 'now_playing' }));
  };

  ws.onmessage = ({ data }) => {
    try { handleMsg(JSON.parse(data)); } catch {}
  };

  ws.onclose = () => {
    setDot(false);
    reconnectTimer = setTimeout(connect, 3000);
  };

  ws.onerror = () => {};
}

function sendCmd(type, extra = {}) {
  if (ws?.readyState === WebSocket.OPEN)
    ws.send(JSON.stringify({ type, ...extra }));
}

// ─── Message routing ──────────────────────────────────────────────────────────
function handleMsg(msg) {
  switch (msg.type) {
    case 'obs_state':
      obsState = { connected: msg.connected, scene: msg.scene ?? '', scenes: msg.scenes ?? [],
                   streaming: msg.streaming, recording: msg.recording };
      renderAll();
      break;
    case 'obs_scene':
      obsState.scene = msg.scene ?? '';
      obsState.scenes = msg.scenes ?? [];
      renderScene();
      renderSceneList();
      break;
    case 'obs_streaming':
      obsState.streaming = msg.streaming ?? null;
      renderStreaming();
      break;
    case 'obs_recording':
      obsState.recording = msg.recording ?? null;
      renderRecording();
      break;
    case 'log':
      appendLog(msg.text);
      break;
    case 'viewer_count':
      viewerCount = msg.count;
      document.getElementById('viewer-count').textContent =
        viewerCount != null ? viewerCount : '';
      break;
    // lore-ok[2ab57293]: fixed at the source instead — server/src/ble.rs now
    // stamps {"type":"heartrate","heartrate":N}, so this case fires. The
    // producer was the wrong shape, not this dispatcher; obs.js sniffs the
    // heartrate field directly and keeps working either way.
    case 'heartrate':
      renderHeartrate(msg.heartrate);
      break;
    case 'now_playing':
      renderSong(msg);
      break;
    case 'sysinfo':
      renderSysinfo(msg);
      break;
    case 'chat_message':
      appendChatLog(msg.user, msg.text);
      break;
    case 'friend_appeared':
      onFriendAppeared(msg.user);
      break;
    case 'friends_present':
      onFriendsPresent(msg.watching ?? [], msg.chatting ?? []);
      break;
  }
}

// ─── Render ───────────────────────────────────────────────────────────────────
function renderAll() {
  renderScene();
  renderStreaming();
  renderRecording();
}

function renderScene() {
  document.getElementById('scene-name').textContent = obsState.scene || '—';
}

function renderStreaming() {
  const info = obsState.streaming;
  const section = document.getElementById('streaming-section');
  if (!info || !info.active) {
    section.style.display = 'none';
    return;
  }
  section.style.display = '';
  streamBaseMs = parseTimecode(info.timecode);
  streamBaseTime = Date.now();
  renderStreamQuality(info);
}

function renderStreamQuality(info) {
  const drop = info.total_frames > 0 ? info.dropped_frames / info.total_frames * 100 : 0;
  const color = drop <= 0.5 ? '#44dd88' : drop <= 2 ? '#ffcc00' : '#ff4444';
  document.getElementById('stream-quality').innerHTML =
    `<span style="color:${color}">↓${info.dropped_frames}f</span> &nbsp;${info.bitrate_kbps} kbps`;
}

function renderRecording() {
  const info = obsState.recording;
  const togBtn  = document.getElementById('btn-rec-toggle');
  const pauseBtn = document.getElementById('btn-pause-rec');
  const recTime  = document.getElementById('rec-time');

  if (!info || !info.active) {
    togBtn.className = 'state-idle';
    togBtn.textContent = '● REC';
    pauseBtn.disabled = true;
    pauseBtn.className = 'state-off';
    pauseBtn.textContent = '⏸ PAUSE';
    recTime.textContent = '0:00:00';
    return;
  }

  togBtn.className = 'state-active';
  togBtn.textContent = '■ STOP';
  pauseBtn.disabled = false;

  recBaseMs = parseTimecode(info.timecode);
  recBaseTime = Date.now();

  if (info.paused) {
    pauseBtn.className = 'state-resume';
    pauseBtn.textContent = '▶ RESUME';
  } else {
    pauseBtn.className = 'state-pause';
    pauseBtn.textContent = '⏸ PAUSE';
  }
}

function renderSysinfo({ cpu_temp, cpu_usage }) {
  const section = document.getElementById('sysinfo-section');
  const tempEl  = document.getElementById('sys-temp-mobile');
  const cpuEl   = document.getElementById('sys-cpu-mobile');
  section.style.display = '';
  if (typeof cpu_temp === 'number') {
    tempEl.textContent = cpu_temp.toFixed(0) + '°';
    tempEl.style.color = cpu_temp >= 80 ? '#ff4444' : cpu_temp >= 60 ? '#ffcc00' : '#44dd88';
  }
  if (typeof cpu_usage === 'number') {
    cpuEl.textContent = cpu_usage.toFixed(0) + '%';
    cpuEl.style.color = cpu_usage >= 80 ? '#ff4444' : cpu_usage >= 50 ? '#ffcc00' : '#44dd88';
  }
}

function renderHeartrate(bpm) {
  const section = document.getElementById('heartrate-section');
  const icon    = document.getElementById('heart-icon');
  const num     = document.getElementById('heart-bpm');
  if (!bpm) { section.style.display = 'none'; return; }
  section.style.display = '';
  num.textContent = bpm;
  const dur = (60 / bpm).toFixed(2) + 's';
  icon.style.setProperty('--hb-dur', dur);
  icon.classList.add('beating');
  const color = bpm <= 100 ? '#44dd88' : bpm <= 125 ? '#ffcc00' : '#ff4444';
  num.style.color = color;
  icon.style.filter = `drop-shadow(0 0 4px ${color})`;
}

function renderSong(msg) {
  const section = document.getElementById('song-section');
  const title   = document.getElementById('song-title');
  const artist  = document.getElementById('song-artist');
  const cover   = document.getElementById('song-cover');
  const t = [msg.title, msg.version].filter(Boolean).join(' · ');
  if (!t && !msg.artist) { section.style.display = 'none'; return; }
  section.style.display = '';
  title.textContent  = t || '—';
  artist.textContent = msg.artist || '';
  musicPaused = msg.paused ?? false;
  document.getElementById('btn-music-playpause').textContent = musicPaused ? '▶' : '⏸';
  if (msg.cover) {
    cover.onerror = msg.coverFallback ? () => { cover.onerror = null; cover.src = msg.coverFallback; } : null;
    cover.src = msg.cover;
    cover.classList.add('visible');
  } else {
    cover.classList.remove('visible');
  }
}

// ─── Friends widget ───────────────────────────────────────────────────────────
// watchingFriends / chattingFriends: { user → { isNew: bool, timer: id|null } }
// watching = IRC JOIN detected → bold; chatting = PRIVMSG only → normal weight

let chattingFriends = {};
let _pendingFlash = null; // set by friend_appeared, consumed by friends_present

function onFriendAppeared(user) {
  _pendingFlash = user; // friends_present arrives right after and applies the flash
}

function onFriendsPresent(watching, chatting) {
  function syncBucket(current, users, bucket) {
    for (const user of users) {
      const isNew = user === _pendingFlash && !current[user];
      if (isNew) {
        // Start 10s flash timer
        bucket[user] = {
          isNew: true,
          timer: setTimeout(() => {
            if (bucket[user]) {
              bucket[user].isNew = false;
              const el = document.getElementById('friend-' + user);
              if (el) el.classList.remove('new');
            }
          }, 10000),
        };
      } else {
        bucket[user] = current[user] ?? { isNew: false, timer: null };
      }
    }
    // Cancel timers for users no longer in this bucket
    for (const [u, s] of Object.entries(current)) {
      if (!bucket[u]) clearTimeout(s.timer);
    }
  }

  const nextW = {}, nextC = {};

  // Watching friends get upgraded from chatting if they were there
  for (const user of watching) {
    if (chattingFriends[user]) { clearTimeout(chattingFriends[user].timer); delete chattingFriends[user]; }
  }

  syncBucket(watchingFriends, watching, nextW);
  syncBucket(chattingFriends, chatting, nextC);

  watchingFriends = nextW;
  chattingFriends = nextC;
  _pendingFlash = null;
  renderFriendsSection();
}

function renderFriendsSection() {
  const section = document.getElementById('friends-section');
  const list = document.getElementById('friends-list');

  // watching first (bold), then chatting
  const entries = [
    ...Object.keys(watchingFriends).map(u => ({ u, watching: true,  s: watchingFriends[u] })),
    ...Object.keys(chattingFriends).map(u => ({ u, watching: false, s: chattingFriends[u] })),
  ];

  if (entries.length === 0) { section.style.display = 'none'; return; }

  section.style.display = '';
  list.innerHTML = '';
  for (const { u, watching, s } of entries) {
    const div = document.createElement('div');
    div.id = 'friend-' + u;
    div.className = 'friend-item' + (watching ? ' watching' : '') + (s.isNew ? ' new' : '');
    div.textContent = u;
    list.appendChild(div);
  }
}

function toggleMusicPause() {

  // Optimistic local toggle while waiting for server echo
  musicPaused = !musicPaused;

const MAX_LINES = 200;
function appendLog(text) {
  const output = document.getElementById('log-output');
  const div = document.createElement('div');
  div.className = 'log-line';
  div.textContent = text;
  output.appendChild(div);
  if (output.children.length > MAX_LINES) output.removeChild(output.firstChild);
  output.scrollTop = output.scrollHeight;
}

function appendChatLog(user, text) {
  const output = document.getElementById('log-output');
  const div = document.createElement('div');
  div.className = 'log-chat';
  attachLongPress(div, () => openUserMenu(user));
  const name = document.createElement('span');
  name.className = 'chat-user';
  name.textContent = user + ': ';
  div.appendChild(name);
  div.appendChild(document.createTextNode(text));
  output.appendChild(div);
  if (output.children.length > MAX_LINES) output.removeChild(output.firstChild);
  output.scrollTop = output.scrollHeight;
}

// ─── Long-press ───────────────────────────────────────────────────────────────
function attachLongPress(el, cb, ms = 500) {
  let timer = null, startX = 0, startY = 0;
  el.addEventListener('touchstart', e => {
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    timer = setTimeout(() => { timer = null; cb(); }, ms);
  }, { passive: true });
  const cancel = () => { clearTimeout(timer); timer = null; };
  el.addEventListener('touchend',    cancel, { passive: true });
  el.addEventListener('touchcancel', cancel, { passive: true });
  el.addEventListener('touchmove', e => {
    const dx = e.touches[0].clientX - startX;
    const dy = e.touches[0].clientY - startY;
    if (Math.hypot(dx, dy) > 10) cancel();
  }, { passive: true });
}

  dot.title = ok ? 'Connected' : 'Disconnected';
  if (ok) acquireWakeLock(); else releaseWakeLock();
}

/** Parse OBS timecode "HH:MM:SS.mmm" to milliseconds */
function parseTimecode(tc) {
  if (!tc) return 0;
  const [h, m, rest] = tc.split(':');
  const [s, ms = '0'] = rest.split('.');
  return (+h * 3600 + +m * 60 + +s) * 1000 + +ms.padEnd(3, '0').slice(0, 3);
}

function fmtDuration(ms) {
  const t = Math.floor(ms / 1000);
  const h = Math.floor(t / 3600);
  const m = Math.floor(t % 3600 / 60);
  const s = t % 60;
  return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

async function acquireWakeLock() {
  // Native Wake Lock API (iOS 16.4+, Chrome, Firefox).
  // Check .released — without it a stale non-null reference blocks re-acquisition.
  if ('wakeLock' in navigator && (!wakeLock || wakeLock.released)) {
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeErr = '';
      wakeLock.addEventListener('release', () => { wakeLock = null; renderWakeDot(); });
    } catch (e) { wakeErr = e?.name || 'error'; }
  }
  // Hidden looping video — older iOS fallback. Silently fails without prior
  // user gesture; touchstart handler below activates it on first touch.
  if (_noSleepVideo.paused) _noSleepVideo.play().catch(() => {});
  renderWakeDot();
}

function releaseWakeLock() {
  wakeLock?.release().catch(() => {});
  wakeLock = null;
  _noSleepVideo.pause();
  renderWakeDot();
}

// Live wake-state badge — makes an otherwise invisible failure observable on the phone.
function renderWakeDot() {
  const el = document.getElementById('wake-dot');
  if (!el) return;
  const supported = 'wakeLock' in navigator;
  const held = !!(wakeLock && !wakeLock.released);
  el.textContent = held ? '🔆' : '🌙';
  el.style.background = held ? '#1c7d4a' : (!supported || wakeErr ? '#c33' : '#886600');
  el.title = held ? 'Screen kept awake'
    : !supported ? 'Wake Lock API unsupported'
    : `Not held${wakeErr ? ' (' + wakeErr + ')' : ''}`;
}

// Re-acquire after tab restore — iOS always releases the lock on hide.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && wsConnected) acquireWakeLock();
});

// iOS requires a user gesture before video.play() — activate on first touch.
document.addEventListener('touchstart', () => {
  if (wsConnected) acquireWakeLock();
}, { passive: true });

// Heartbeat: re-acquire every 30 s in case iOS silently dropped the lock.
setInterval(() => {
  if (wsConnected && (!wakeLock || wakeLock.released)) acquireWakeLock();
}, 30000);

// Tap the badge for the exact state — distinguishes "not granted" from "OS overrides us".
document.getElementById('wake-dot')?.addEventListener('click', () => {
  const supported = 'wakeLock' in navigator;
  const held = !!(wakeLock && !wakeLock.released);
  alert(
    'Screen Wake Lock\n' +
    `• held: ${held}\n` +
    `• API supported: ${supported}\n` +
    `• last error: ${wakeErr || 'none'}\n\n` +
    'If held is true but the screen still sleeps, it is an iOS setting the web cannot override:\n' +
    '– turn off Low Power Mode, and/or\n' +
    '– Settings ▸ Display & Brightness ▸ Auto-Lock ▸ Never'
  );
});
renderWakeDot();

// ─── Init ─────────────────────────────────────────────────────────────────────
connect();
</script>

<!doctype html>
<!--
  Kira PNG-tuber overlay (vany 2026-10-17). Its own OBS browser source: position and size are
  the source's transform in OBS; the page fills whatever box it gets, background transparent.
  URL: https://localhost:8443/kira-avatar/  params: ?threshold=0.02  ?blink=0 (no blinking)
  Levels arrive on the /obs bus as {type:"kira_level", level} from teammater's glados-link.
  Frames (frames/*.webp, real alpha, all drawn in the same pose so they swap in place):
  idle, talk, wink (also stands in for blink: no closed-eyes frame exists yet), and the
  emotions happy/pouty/sleepy/surprised/tender/thoughtful. Which one shows: mood.js.
  Emotions arrive as {type:"kira_emotion", emotion} when a tagged say clip starts.
-->
<html lang="en">
    <meta charset="utf-8" />
    <title>Kira</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }
        body { display: flex; align-items: flex-end; justify-content: center; }

        /* Square stage, anchored at the bottom (she is cut at the chest), headroom for the bounce. */
        #kira {
            position: relative;
            width: 94vmin;
            height: 94vmin;
            /* Grow from the bottom edge, never lift: a lifted chest cut would float above the screen edge. */
            transform-origin: 50% 100%;
            transform: scale(calc(1 + var(--amp, 0) * 0.06));
            transition: transform 60ms linear, filter 120ms;
            filter: drop-shadow(0 0 1.5vmin rgba(150, 90, 255, 0.35));
        }
        #kira.speaking { filter: drop-shadow(0 0 2.5vmin rgba(190, 130, 255, 0.7)); }

        /* One frame visible at a time: avatar.js puts .on on the frame mood.js picks. */
        #kira img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0; }
        #kira img.on { opacity: 1; }
    </style>
    <div id="kira">
        <img id="idle" src="frames/idle.webp" alt="" />
        <img id="talk" src="frames/talk.webp" alt="" />
        <img id="wink" src="frames/wink.webp" alt="" />
        <img id="happy" src="frames/happy.webp" alt="" />
        <img id="pouty" src="frames/pouty.webp" alt="" />
        <img id="sleepy" src="frames/sleepy.webp" alt="" />
        <img id="surprised" src="frames/surprised.webp" alt="" />
        <img id="tender" src="frames/tender.webp" alt="" />
        <img id="thoughtful" src="frames/thoughtful.webp" alt="" />
    </div>
    <script type="module" src="avatar.js"></script>
</html>
